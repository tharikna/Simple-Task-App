<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Task &amp; Project Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column — status summary strip, toolbar, then a list of rows (table-like on desktop, stacked cards on phones). */
:root {
  --bg: #f5f7f9;
  --surface: #ffffff;
  --fg: #16202b;
  --muted: #5b6876;
  --line: #dde3ea;
  --accent: #2557d6;
  --accent-fg: #ffffff;
  --accent-soft: #e6edfc;
  --s-new: #6b7785; --s-new-bg: #eef1f4;
  --s-prog: #a35c00; --s-prog-bg: #fdf0dc;
  --s-done: #1d7a46; --s-done-bg: #e2f4e9;
  --danger: #c2372b; --danger-bg: #fbe7e5;
  --proj: #6a3fc4; --proj-bg: #efe8fb;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --surface: #171e26; --fg: #e6ebf0; --muted: #9aa6b3; --line: #2a3440;
  --accent: #7ea2ff; --accent-fg: #0b1220; --accent-soft: #1c2a47;
  --s-new: #a6b1bd; --s-new-bg: #242d37;
  --s-prog: #f2b45c; --s-prog-bg: #3a2a12;
  --s-done: #6fd39a; --s-done-bg: #15321f;
  --danger: #ff8a7f; --danger-bg: #3d1a17;
  --proj: #b79bff; --proj-bg: #2a2142;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e26; --fg: #e6ebf0; --muted: #9aa6b3; --line: #2a3440;
  --accent: #7ea2ff; --accent-fg: #0b1220; --accent-soft: #1c2a47;
  --s-new: #a6b1bd; --s-new-bg: #242d37;
  --s-prog: #f2b45c; --s-prog-bg: #3a2a12;
  --s-done: #6fd39a; --s-done-bg: #15321f;
  --danger: #ff8a7f; --danger-bg: #3d1a17;
  --proj: #b79bff; --proj-bg: #2a2142;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 1.7rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.sync { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 10px; }
.btn.ghost:hover { color: var(--fg); background: var(--bg); }

/* summary strip */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; display: grid; gap: 2px; }
.stat[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stat .n { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
@media (max-width: 560px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.search { flex: 1 1 200px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.toolbar .btn.primary { margin-left: auto; }

/* list */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row, .head { display: grid; grid-template-columns: 86px minmax(0, 1fr) 150px 150px 100px 76px; gap: 12px; align-items: center; padding: 12px 16px; }
.head { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); border-bottom: 1px solid var(--line); padding-block: 9px; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: color-mix(in srgb, var(--bg) 60%, var(--surface)); }
.title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.title.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.notes { display: block; font-weight: 400; font-size: 0.85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.poc { display: flex; align-items: center; gap: 8px; min-width: 0; }
.poc span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 700; display: grid; place-items: center; }
.none { color: var(--muted); font-style: italic; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; width: max-content; }
.chip.task { background: var(--s-new-bg); color: var(--fg); }
.chip.project { background: var(--proj-bg); color: var(--proj); }
.status-sel { appearance: none; border: 0; border-radius: 999px; padding: 4px 12px; font-size: 0.82rem; font-weight: 600; width: 100%; max-width: 150px; background-image: none; }
.status-sel[data-s="not_started"] { background: var(--s-new-bg); color: var(--s-new); }
.status-sel[data-s="in_progress"] { background: var(--s-prog-bg); color: var(--s-prog); }
.status-sel[data-s="finished"] { background: var(--s-done-bg); color: var(--s-done); }
.due { font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.due.late { color: var(--danger); }
.actions { display: flex; justify-content: flex-end; gap: 2px; }
.icon { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; }
.icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty strong { color: var(--fg); font-size: 1.05rem; }
.lbl { display: none; }

@media (max-width: 760px) {
  .head { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "type actions" "title title" "poc poc" "status due"; gap: 8px 12px; }
  .c-type { grid-area: type; } .c-title { grid-area: title; } .c-poc { grid-area: poc; }
  .c-status { grid-area: status; } .c-due { grid-area: due; justify-self: end; } .c-act { grid-area: actions; }
  .lbl { display: inline; color: var(--muted); font-size: 0.75rem; margin-right: 4px; font-family: var(--font-ui); }
}

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); padding: 0; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(10 15 25 / 0.45); }
form.edit { display: grid; gap: 14px; padding: 22px; }
form.edit h2 { margin: 0; font-size: 1.15rem; }
.field { display: grid; gap: 5px; }
.field > label, .field > .legend { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); padding: 9px 11px; width: 100%; }
.field textarea { min-height: 80px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .two { grid-template-columns: 1fr; } }
.radio { display: flex; gap: 8px; }
.radio label { flex: 1; border: 1px solid var(--line); border-radius: var(--r); padding: 9px 11px; display: flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 600; }
.radio label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.err { color: var(--danger); font-size: 0.85rem; margin: 0; }
.foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.confirm { padding: 22px; display: grid; gap: 14px; }
.confirm h2 { margin: 0; font-size: 1.1rem; }
.confirm p { margin: 0; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: var(--r); font-size: 0.88rem; font-weight: 600; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .row { transition: background .12s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Task &amp; Project Board</h1>
      <p class="sub">Track tasks and projects, who owns them, and where they stand.</p>
    </div>
    <span class="sync" id="sync">Connecting…</span>
  </header>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Filter by type" id="typeSeg">
      <button type="button" data-type="all" aria-pressed="true">All</button>
      <button type="button" data-type="task" aria-pressed="false">Tasks</button>
      <button type="button" data-type="project" aria-pressed="false">Projects</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search title, POC or notes" aria-label="Search">
    <button class="btn primary" type="button" id="newBtn">+ New item</button>
  </div>

  <div class="list" id="list" aria-live="polite"></div>
</div>

<dialog id="editDlg">
  <form class="edit" id="editForm" novalidate>
    <h2 id="editTitle">New item</h2>
    <div class="field">
      <span class="legend">Category</span>
      <div class="radio">
        <label><input type="radio" name="type" id="f-type-task" value="task" checked> Task</label>
        <label><input type="radio" name="type" id="f-type-project" value="project"> Project</label>
      </div>
    </div>
    <div class="field">
      <label for="f-title">Title</label>
      <input id="f-title" name="title" maxlength="160" required placeholder="e.g. Prepare Q1 budget review">
    </div>
    <div class="two">
      <div class="field">
        <label for="f-poc">POC (point of contact)</label>
        <input id="f-poc" name="poc" maxlength="80" placeholder="e.g. Aisha Rahman">
      </div>
      <div class="field">
        <label for="f-status">Status</label>
        <select id="f-status" name="status">
          <option value="not_started">Haven't started</option>
          <option value="in_progress">In progress</option>
          <option value="finished">Finished</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="f-due">Due date (optional)</label>
      <input id="f-due" name="due" type="date">
    </div>
    <div class="field">
      <label for="f-notes">Notes (optional)</label>
      <textarea id="f-notes" name="notes" maxlength="2000"></textarea>
    </div>
    <p class="err" id="formErr" hidden></p>
    <div class="foot">
      <button class="btn" type="button" id="cancelBtn">Cancel</button>
      <button class="btn primary" type="submit" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<dialog id="delDlg">
  <div class="confirm">
    <h2>Delete this item?</h2>
    <p id="delText"></p>
    <div class="foot">
      <button class="btn" type="button" id="delCancel">Keep it</button>
      <button class="btn danger" type="button" id="delOk">Delete</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const STATUS = {
    not_started: { label: "Haven't started", color: "var(--s-new)" },
    in_progress: { label: "In progress", color: "var(--s-prog)" },
    finished: { label: "Finished", color: "var(--s-done)" },
  };
  const $ = (id) => document.getElementById(id);
  let items = [];          // [{id, type, title, poc, status, due, notes, createdAt, updatedAt}]
  let store = null;        // adapter: {save(item), remove(id)}
  let canWrite = true;
  const view = { type: "all", status: "all", q: "" };
  let editingId = null, deletingId = null;

  // ---------- storage ----------
  const LOCAL_KEY = "task-board-items";
  function localAdapter() {
    try { items = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch { items = []; }
    const persist = () => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); } catch {} };
    return {
      async save(it) { const i = items.findIndex(x => x.id === it.id); if (i >= 0) items[i] = it; else items.push(it); persist(); render(); },
      async remove(id) { items = items.filter(x => x.id !== id); persist(); render(); },
    };
  }
  function dbAdapter(db) {
    const col = db.collection("tasks");
    let loaded = false;
    const timer = setTimeout(() => { if (!loaded) setSync("Can't reach saved items yet…"); }, 10000);
    col.onSnapshot((snap) => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); setSync("Saved · shared with everyone on this page"); }
      render();
    }, (e) => { clearTimeout(timer); setSync("Sync stopped (" + e.code + ")"); });
    return {
      async save(it) { const { id, ...body } = it; await col.doc(id).set(body); },
      async remove(id) { await col.doc(id).delete(); },
    };
  }
  function setSync(t) { $("sync").textContent = t; }

  async function init() {
    render();
    let db = null, user = null;
    try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
    try { user = window.claude ? await window.claude.use("user") : null; } catch { user = null; }
    if (db) {
      store = dbAdapter(db);
      if (user) { try { const w = await user.can("data.write"); if (w === false) { canWrite = false; render(); } } catch {} }
    } else {
      store = localAdapter();
      setSync("Saved in this browser only");
      render();
    }
  }

  // ---------- rendering ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = (n) => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const today = () => new Date().toISOString().slice(0, 10);
  function fmtDate(d) {
    if (!d) return "";
    const dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  function renderSummary(pool) {
    const counts = { all: pool.length, not_started: 0, in_progress: 0, finished: 0 };
    pool.forEach(i => counts[i.status] = (counts[i.status] || 0) + 1);
    const tile = (key, label, color) => `<button type="button" class="stat" data-status="${key}" aria-pressed="${view.status === key}">
      <span class="l">${color ? `<span class="dot" style="background:${color}"></span>` : ""}${label}</span>
      <span class="n">${counts[key]}</span></button>`;
    $("summary").innerHTML = tile("all", "All items") +
      Object.entries(STATUS).map(([k, s]) => tile(k, s.label, s.color)).join("");
  }

  const ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const ICON_DEL = '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

  function render() {
    const byType = items.filter(i => view.type === "all" || i.type === view.type);
    renderSummary(byType);
    const q = view.q.trim().toLowerCase();
    const shown = byType
      .filter(i => view.status === "all" || i.status === view.status)
      .filter(i => !q || [i.title, i.poc, i.notes].some(v => (v || "").toLowerCase().includes(q)))
      .sort((a, b) => {
        const order = { in_progress: 0, not_started: 1, finished: 2 };
        return (order[a.status] - order[b.status]) || (a.due || "9999").localeCompare(b.due || "9999") || (b.updatedAt || 0) - (a.updatedAt || 0);
      });

    $("newBtn").hidden = !canWrite;
    const list = $("list");
    if (!items.length) {
      list.innerHTML = `<div class="empty"><strong>No tasks or projects yet</strong>
        <span>Add your first item with a title, a point of contact and a status.</span>
        ${canWrite ? '<button class="btn primary" type="button" data-act="new">+ New item</button>' : ""}</div>`;
      return;
    }
    if (!shown.length) {
      list.innerHTML = `<div class="empty"><strong>Nothing matches these filters</strong><span>Try another category, status or search term.</span></div>`;
      return;
    }
    const t = today();
    list.innerHTML = `<div class="head"><span>Type</span><span>Title</span><span>POC</span><span>Status</span><span>Due</span><span></span></div>` +
      shown.map(i => {
        const late = i.due && i.due < t && i.status !== "finished";
        const opts = Object.entries(STATUS).map(([k, s]) => `<option value="${k}" ${k === i.status ? "selected" : ""}>${s.label}</option>`).join("");
        return `<div class="row" data-id="${esc(i.id)}">
          <span class="c-type"><span class="chip ${i.type}">${i.type === "project" ? "Project" : "Task"}</span></span>
          <span class="c-title title ${i.status === "finished" ? "done" : ""}">${esc(i.title)}${i.notes ? `<span class="notes">${esc(i.notes)}</span>` : ""}</span>
          <span class="c-poc poc">${i.poc ? `<span class="avatar" aria-hidden="true">${esc(initials(i.poc))}</span><span>${esc(i.poc)}</span>` : '<span class="none">No POC</span>'}</span>
          <span class="c-status"><select class="status-sel" data-s="${i.status}" aria-label="Status of ${esc(i.title)}" ${canWrite ? "" : "disabled"}>${opts}</select></span>
          <span class="c-due due ${late ? "late" : ""}">${i.due ? `<span class="lbl">Due</span>${fmtDate(i.due)}${late ? " · late" : ""}` : '<span class="none">—</span>'}</span>
          <span class="c-act actions">${canWrite ? `<button class="btn ghost icon" type="button" data-act="edit" aria-label="Edit">${ICON_EDIT}</button>
            <button class="btn ghost icon" type="button" data-act="del" aria-label="Delete">${ICON_DEL}</button>` : ""}</span>
        </div>`;
      }).join("");
  }

  // ---------- toast ----------
  let toastT;
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }
  function failMsg(e) { return e && e.code === "invalid_argument" ? "You don't have permission to change items here." : e && e.code === "quota_exceeded" ? "Storage is full. Delete some items first." : "Couldn't save. Check your connection and try again."; }

  // ---------- create / update ----------
  function openEditor(item) {
    editingId = item ? item.id : null;
    $("editTitle").textContent = item ? "Edit item" : "New item";
    $("saveBtn").textContent = item ? "Save changes" : "Create";
    const f = $("editForm");
    f.reset();
    $("formErr").hidden = true;
    f.type.value = item?.type || (view.type === "project" ? "project" : "task");
    f.title.value = item?.title || "";
    f.poc.value = item?.poc || "";
    f.status.value = item?.status || "not_started";
    f.due.value = item?.due || "";
    f.notes.value = item?.notes || "";
    $("editDlg").showModal();
    f.title.focus();
  }
  $("editForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const title = f.title.value.trim();
    if (!title) { $("formErr").textContent = "Add a title so you can find this item later."; $("formErr").hidden = false; f.title.focus(); return; }
    const prev = items.find(x => x.id === editingId);
    const now = Date.now();
    const item = {
      id: editingId || ("t" + now.toString(36) + Math.random().toString(36).slice(2, 7)),
      type: f.type.value, title, poc: f.poc.value.trim(), status: f.status.value,
      due: f.due.value || "", notes: f.notes.value.trim(),
      createdAt: prev?.createdAt || now, updatedAt: now,
    };
    $("saveBtn").disabled = true;
    try { await store.save(item); $("editDlg").close(); toast(editingId ? "Changes saved" : "Item created"); }
    catch (err) { $("formErr").textContent = failMsg(err); $("formErr").hidden = false; }
    finally { $("saveBtn").disabled = false; }
  });
  $("cancelBtn").addEventListener("click", () => $("editDlg").close());

  // ---------- delete ----------
  function openDelete(item) {
    deletingId = item.id;
    $("delText").textContent = `“${item.title}” will be removed for everyone. This can't be undone.`;
    $("delDlg").showModal();
  }
  $("delCancel").addEventListener("click", () => $("delDlg").close());
  $("delOk").addEventListener("click", async () => {
    try { await store.remove(deletingId); $("delDlg").close(); toast("Item deleted"); }
    catch (err) { $("delDlg").close(); toast(failMsg(err)); }
  });

  // ---------- events ----------
  $("newBtn").addEventListener("click", () => openEditor(null));
  $("list").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]"); if (!b || !store) return;
    if (b.dataset.act === "new") return openEditor(null);
    const it = items.find(x => x.id === b.closest(".row").dataset.id);
    if (!it) return;
    b.dataset.act === "edit" ? openEditor(it) : openDelete(it);
  });
  $("list").addEventListener("change", async (e) => {
    const sel = e.target.closest(".status-sel"); if (!sel || !store) return;
    const it = items.find(x => x.id === sel.closest(".row").dataset.id); if (!it) return;
    sel.dataset.s = sel.value;
    try { await store.save({ ...it, status: sel.value, updatedAt: Date.now() }); toast("Status: " + STATUS[sel.value].label); }
    catch (err) { sel.value = it.status; sel.dataset.s = it.status; toast(failMsg(err)); }
  });
  $("summary").addEventListener("click", (e) => {
    const b = e.target.closest(".stat"); if (!b) return;
    view.status = b.dataset.status; render();
  });
  $("typeSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    view.type = b.dataset.type;
    $("typeSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
  $("search").addEventListener("input", (e) => { view.q = e.target.value; render(); });

  init();
})();
</script>

</body>
</html>
